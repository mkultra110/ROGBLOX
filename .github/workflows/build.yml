name: Build ROGBLOX.exe

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a build manually from the UI

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bundle Lua modules
        shell: pwsh
        run: |
          python bundle.py
          if (!(Test-Path dist/rogblox.lua)) {
            throw 'bundle.py did not produce dist/rogblox.lua'
          }

      - name: Configure CMake (MSVC)
        shell: pwsh
        run: cmake -S cpp -B cpp/build -A x64

      - name: Build loader
        shell: pwsh
        run: cmake --build cpp/build --config Release --target rogblox-loader -- /m

      - name: Stage ROGBLOX.exe at repo root
        shell: pwsh
        run: |
          $src = "cpp/build/loader/Release/rogblox-loader.exe"
          if (!(Test-Path $src)) {
            Get-ChildItem cpp/build -Recurse -Filter "*.exe" | ForEach-Object {
              Write-Host "Found: $_"
            }
            throw "Build finished but $src is missing"
          }
          Copy-Item $src "ROGBLOX.exe" -Force
          $size = (Get-Item ROGBLOX.exe).Length
          Write-Host ("Built ROGBLOX.exe ({0:N0} bytes)" -f $size)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROGBLOX-${{ github.run_number }}
          path: ROGBLOX.exe
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ROGBLOX.exe) {
            $size = (Get-Item ROGBLOX.exe).Length
            $kb = [Math]::Round($size / 1KB, 1)
            "## ROGBLOX.exe built  ($kb KB)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "Download from the **Artifacts** section above." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "## Build failed" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
